<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Профіль Драго</title>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #121212);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --button-color: var(--tg-theme-button-color, #2ea6ff);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
            --card-bg: var(--tg-theme-secondary-bg-color, #1e1e1e);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--button-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-info h2 {
            margin: 0;
            font-size: 20px;
        }

        .user-info p {
            margin: 4px 0 0 0;
            font-size: 13px;
            color: var(--hint-color);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 12px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: var(--hint-color);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: var(--button-color);
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            margin: 15px 0 8px 0;
            color: var(--hint-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .inventory-list {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 10px;
            min-height: 40px;
            font-size: 14px;
        }

        .inventory-item {
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .inventory-item:last-child {
            border-bottom: none;
        }

        button {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        #status-msg {
            text-align: center;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- Шапка профілю -->
        <div class="header">
            <div class="avatar" id="user-avatar">🐲</div>
            <div class="user-info">
                <h2 id="user-name">Завантаження...</h2>
                <p id="user-username">@username</p>
            </div>
        </div>

        <!-- Статистика -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">⭐ Рівень</div>
                <div class="stat-value" id="user-level">...</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">💳 Баланс</div>
                <div class="stat-value" id="user-balance">... грн</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">💬 Повідомлень</div>
                <div class="stat-value" id="user-msgs">...</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">👤 Стать</div>
                <div class="stat-value" id="user-gender">...</div>
            </div>
        </div>

        <!-- Інвентар / Майно -->
        <div class="section-title">📦 Майно та предмети</div>
        <div class="inventory-list" id="inventory-container">
            <i>Завантаження інвентарю...</i>
        </div>

        <!-- Кнопки дій -->
        <button id="upgrade-btn" onclick="upgradeSkill('power')">⚡ Прокачати Силу (-1000 грн)</button>
        <div id="status-msg"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const API_URL = 'https://dragobott.onrender.com';

        // Витягуємо дані користувача з Telegram SDK
        const tgUser = tg.initDataUnsafe?.user || {};
        const userId = tgUser.id || 0; // Для тестів у браузері підставиться ID або 0

        // 1. Завантаження профілю
        async function loadProfile() {
            // Відображаємо дані з Telegram одразу, поки вантажиться БД
            document.getElementById('user-name').innerText = tgUser.first_name || 'Гравець';
            document.getElementById('user-username').innerText = tgUser.username ? `@${tgUser.username}` : `ID: ${userId}`;
            
            if (tgUser.photo_url) {
                document.getElementById('user-avatar').innerHTML = `<img src="${tgUser.photo_url}" alt="avatar">`;
            } else if (tgUser.first_name) {
                document.getElementById('user-avatar').innerText = tgUser.first_name[0].toUpperCase();
            }

            try {
                const response = await fetch(`${API_URL}/api/get_stats`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        initData: tg.initData,
                        user_id: userId 
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    document.getElementById('user-name').innerText = data.name || tgUser.first_name;
                    document.getElementById('user-level').innerText = data.level;
                    document.getElementById('user-balance').innerText = `${data.balance.toLocaleString()} грн`;
                    document.getElementById('user-msgs').innerText = data.msg_count;
                    document.getElementById('user-gender').innerText = data.gender;

                    // Відображення інвентарю
                    const invContainer = document.getElementById('inventory-container');
                    if (data.items && data.items.length > 0) {
                        invContainer.innerHTML = data.items.map(item => `<div class="inventory-item">🔹 ${item}</div>`).join('');
                    } else {
                        invContainer.innerHTML = '<i style="color: var(--hint-color)">Порожньо...</i>';
                    }
                } else {
                    showStatus('❌ Не вдалося завантажити дані з БД', true);
                }
            } catch (err) {
                console.error(err);
                showStatus('❌ Помилка зєднання з сервером', true);
            }
        }

        // 2. Прокачка
        async function upgradeSkill(skillId) {
            const btn = document.getElementById('upgrade-btn');
            btn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/api/upgrade`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        initData: tg.initData,
                        user_id: userId,
                        skill_id: skillId
                    })
                });

                const result = await response.json();
                if (result.success) {
                    showStatus('✅ Успішно прокачано!');
                    loadProfile(); // Перезавантажуємо профіль з оновленими цифрами
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                } else {
                    showStatus(`⚠️ ${result.message || 'Недостатньо коштів'}`, true);
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                }
            } catch (e) {
                showStatus('❌ Сервер не відповідає', true);
            } finally {
                btn.disabled = false;
            }
        }

        function showStatus(msg, isError = false) {
            const el = document.getElementById('status-msg');
            el.innerText = msg;
            el.style.color = isError ? '#ff5252' : '#4caf50';
            setTimeout(() => { el.innerText = ''; }, 3000);
        }

        loadProfile();
    </script>
</body>
</html>
