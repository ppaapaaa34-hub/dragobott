<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drago Arena</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="styles.css"></head><body><main class="app"><header><img id="avatar" alt="Аватар героя"><div><strong id="hero-name">Герой Драго</strong><small id="hero-level">Рівень 1</small></div><div class="coins">🪙 <span id="coins">0</span></div></header><section class="hero"><div class="crown">👑</div><h1>DRAGO ARENA</h1><p>Герой, арена та імперія тапів</p><div class="bar"><i id="xp-bar"></i></div><small id="xp">0 / 100 XP</small></section><section class="autoclick"><div><b>🤖 Автоклікер</b><small>+<span id="auto-rate">1</span> 🪙 щосекунди</small></div><button id="auto-toggle">▶️ Увімкнути</button></section><nav><button data-tab="arena" class="active">⚔️ Арена</button><button data-tab="hero">🛡️ Герой</button><button data-tab="loot">🎒 Лут</button></nav><section id="arena" class="tab active"><div class="battlefield"><article class="fighter player"><div id="player-emoji">🧙</div><h2 id="player-name">Герой Драго</h2><div class="hp"><i id="player-hp"></i></div><small id="player-hp-text"></small></article><div class="versus">VS</div><article class="fighter enemy"><div id="enemy-emoji">👹</div><h2 id="enemy-name">Оберіть бій</h2><div class="hp"><i id="enemy-hp"></i></div><small id="enemy-hp-text"></small></article></div><p id="battle-log" class="log">Натисни «Новий противник», щоб почати.</p><div class="actions"><button id="new-enemy">🎲 Новий противник</button><button id="attack" disabled>⚔️ Атакувати</button><button id="heal" disabled>✨ Зілля (<span id="potions">3</span>)</button></div></section><section id="hero" class="tab"><h2>🛡️ Мій персонаж</h2><div class="stats"><div>⚔️ Атака <b id="stat-atk"></b></div><div>🛡️ Захист <b id="stat-def"></b></div><div>❤️ Здоров’я <b id="stat-hp"></b></div><div>🏆 Перемоги <b id="wins"></b></div></div><button id="upgrade">⬆️ Покращити героя — 50 🪙</button></section><section id="loot" class="tab"><h2>🎒 Здобич</h2><div id="loot-list" class="loot"></div></section><footer>Прогрес зберігається автоматично</footer></main><script src="script.js?v=autoclicker-1"></script></body></html>
