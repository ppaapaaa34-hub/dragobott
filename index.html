<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drago Tap</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    margin-top:20px;
}

#money{
    font-size:34px;
    margin:20px;
    font-weight:bold;
}

#tap{
    width:220px;
    height:220px;
    border-radius:50%;
    background:linear-gradient(45deg,#ff7300,#ff0000);
    display:flex;
    justify-content:center;
    align-items:center;
    margin:auto;
    font-size:70px;
    cursor:pointer;
    user-select:none;
    transition:.08s;
}

#tap:active{
    transform:scale(.93);
}

#lvl{
    margin-top:20px;
    font-size:24px;
}

button{
    margin-top:25px;
    padding:14px 30px;
    border:none;
    border-radius:12px;
    background:#16a34a;
    color:white;
    font-size:18px;
}
</style>
</head>

<body>

<h1>💰 Drago Tap</h1>

<div id="money">0 грн</div>

<div id="tap">
💸
</div>

<div id="lvl">
Рівень 1
</div>

<button onclick="upgrade()">
⬆ Покращити (+1)
</button>

<script>

Telegram.WebApp.expand();

let money=0;
let level=1;
let power=1;

const moneyText=document.getElementById("money");
const lvl=document.getElementById("lvl");

function draw(){
moneyText.innerHTML=money.toLocaleString()+" грн";
lvl.innerHTML="Рівень "+level+"<br>Тап +" + power;
}

document.getElementById("tap").onclick=()=>{

money+=power;

draw();

};

function upgrade(){

let cost=level*100;

if(money<cost){
Telegram.WebApp.showAlert("Не вистачає "+cost+" грн");
return;
}

money-=cost;
level++;
power++;

draw();

}

draw();

</script>

</body>
</html>
