<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Drago Mini App</title>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1a1a1a);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --button-color: var(--tg-theme-button-color, #2ea6ff);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #282828);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        .card {
            background-color: var(--secondary-bg);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .stat-item {
            font-size: 18px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .stat-value {
            font-weight: bold;
            color: var(--button-color);
        }

        button {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status-message {
            margin-top: 10px;
            font-size: 14px;
            color: var(--hint-color);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🐉 Статистика гравця</h1>
        
        <div class="stat-item">
            <span>Рівень:</span>
            <span id="user-level" class="stat-value">⏳...</span>
        </div>
        
        <div class="stat-item">
            <span>Монети:</span>
            <span id="user-coins" class="stat-value">⏳...</span>
        </div>

        <button id="upgrade-btn" onclick="upgradeSkill('power')">⚡ Прокачати Силу</button>
        <div id="status-message"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        // Повідомляємо Telegram, що Mini App готовий до відображення і розгортаємо його
        tg.ready();
        tg.expand();

        const API_BASE_URL = 'https://dragobott.onrender.com';

        // 1. Автоматично завантажуємо статистику при відкритті
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/get_stats`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: tg.initData })
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('user-level').innerText = data.level;
                    document.getElementById('user-coins').innerText = data.coins;
                } else {
                    showStatus("❌ Помилка завантаження даних", true);
                }
            } catch (error) {
                console.error("Помилка завантаження статистики:", error);
                showStatus("❌ Помилка з'єднання з сервером", true);
            }
        }

        // 2. Функція для прокачки без закриття Mini App
        async function upgradeSkill(skillId) {
            const btn = document.getElementById('upgrade-btn');
            btn.disabled = true;
            btn.innerText = "Оновлення...";

            try {
                const response = await fetch(`${API_BASE_URL}/api/upgrade`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        initData: tg.initData,
                        skill_id: skillId
                    })
                });

                const result = await response.json();
                
                if (response.ok && result.success) {
                    document.getElementById('user-level').innerText = result.new_level;
                    document.getElementById('user-coins').innerText = result.new_coins;
                    showStatus("✅ Успішно прокачано!");
                    
                    // Легка вібрація смартфона при успішній дії
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('success');
                    }
                } else {
                    showStatus(`⚠️ ${result.message || 'Недостатньо монет!'}`, true);
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('error');
                    }
                }
            } catch (error) {
                console.error("Помилка при оновленні:", error);
                showStatus("❌ Сервер не відповідає", true);
            } finally {
                btn.disabled = false;
                btn.innerText = "⚡ Прокачати Силу";
            }
        }

        function showStatus(text, isError = false) {
            const msgEl = document.getElementById('status-message');
            msgEl.innerText = text;
            msgEl.style.color = isError ? '#ff5252' : '#4caf50';
            setTimeout(() => { msgEl.innerText = ''; }, 3000);
        }

        // Викликаємо завантаження даних одразу при відкритті
        loadStats();
    </script>
</body>
</html>
