<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Drago Mini App</title>
</head>
<body>

    <h1>Статистика гравця</h1>
    <p>Рівень: <span id="user-level">...</span></p>
    <p>Монети: <span id="user-coins">...</span></p>

    <button onclick="upgradeSkill('power')">Прокачати Силу</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // 1. Автоматично завантажуємо статистику при відкритті
        async function loadStats() {
            try {
                const response = await fetch('https://dragobott.onrender.com/api/get_stats', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: tg.initData })
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('user-level').innerText = data.level;
                    document.getElementById('user-coins').innerText = data.coins;
                }
            } catch (error) {
                console.error("Помилка завантаження статистики:", error);
            }
        }

        // 2. Функція для прокачки без закриття Mini App
        async function upgradeSkill(skillId) {
            try {
                const response = await fetch('https://dragobott.onrender.com/api/upgrade', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        initData: tg.initData,
                        skill_id: skillId
                    })
                });

                const result = await response.json();
                if (result.success) {
                    document.getElementById('user-level').innerText = result.new_level;
                    document.getElementById('user-coins').innerText = result.new_coins;
                }
            } catch (error) {
                console.error("Помилка при оновленні:", error);
            }
        }

        // Викликаємо завантаження даних одразу при відкритті
        loadStats();
    </script>
</body>
</html>
