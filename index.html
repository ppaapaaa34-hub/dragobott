<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Профіль Драго</title>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #121212);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --button-color: var(--tg-theme-button-color, #2ea6ff);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
            --card-bg: var(--tg-theme-secondary-bg-color, #1e1e1e);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--button-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-info h2 {
            margin: 0;
            font-size: 20px;
        }

        .user-info p {
            margin: 4px 0 0 0;
            font-size: 13px;
            color: var(--hint-color);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 12px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: var(--hint-color);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 15px;
            font-weight: bold;
            color: var(--button-color);
        }

        .section-title {
            font-size: 13px;
            font-weight: bold;
            margin: 15px 0 8px 0;
            color: var(--hint-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .custom-list {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 8px;
            min-height: 35px;
            font-size: 14px;
        }

        .list-item {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .reorder-btns {
            display: none;
            gap: 4px;
        }

        .edit-mode .reorder-btns {
            display: flex;
        }

        .btn-mini {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-color);
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-mini:active {
            background: var(--button-color);
        }

        button.action-btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }

        .edit-form {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 10px;
        }

        .edit-form label {
            font-size: 12px;
            color: var(--hint-color);
        }

        .edit-form input, .edit-form select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px;
            border-radius: 8px;
            font-size: 14px;
        }

        #status-msg {
            text-align: center;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="header">
            <div class="avatar" id="user-avatar">🐲</div>
            <div class="user-info">
                <h2 id="user-name">Завантаження...</h2>
                <p id="user-username">@username</p>
            </div>
        </div>

        <div class="edit-form" id="edit-form">
            <label>Ігровий нікнейм:</label>
            <input type="text" id="edit-name-input" placeholder="Введи свій нік">

            <label>Стать:</label>
            <select id="edit-gender-select">
                <option value="Хлопець">Хлопець</option>
                <option value="Дівчина">Дівчина</option>
                <option value="Невідомо">Невідомо</option>
            </select>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">⭐ Рівень</div>
                <div class="stat-value" id="user-level">...</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">💳 Баланс</div>
                <div class="stat-value" id="user-balance">... грн</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">💬 Повідомлень</div>
                <div class="stat-value" id="user-msgs">...</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">👤 Стать</div>
                <div class="stat-value" id="user-gender">...</div>
            </div>
        </div>

        <!-- Спеціальні Блоки -->
        <div class="section-title">💼 Мої Бізнеси</div>
        <div class="custom-list" id="businesses-container">
            <i>Завантаження...</i>
        </div>

        <div class="section-title">📦 Майно та предмети</div>
        <div class="custom-list" id="inventory-container">
            <i>Завантаження...</i>
        </div>

        <button class="action-btn" id="edit-toggle-btn" onclick="toggleEditMode()">⚙️ Редагувати профіль</button>
        <div id="status-msg"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const API_URL = 'https://dragobott.onrender.com';
        const tgUser = tg.initDataUnsafe?.user || {};
        const userId = tgUser.id || 0;

        let currentData = {
            name: '',
            gender: '',
            items: [],
            businesses: []
        };
        let isEditMode = false;

        async function loadProfile() {
            document.getElementById('user-name').innerText = tgUser.first_name || 'Гравець';
            document.getElementById('user-username').innerText = tgUser.username ? `@${tgUser.username}` : `ID: ${userId}`;
            
            if (tgUser.photo_url) {
                document.getElementById('user-avatar').innerHTML = `<img src="${tgUser.photo_url}" alt="avatar">`;
            }

            try {
                const response = await fetch(`${API_URL}/api/get_stats`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId })
                });

                if (response.ok) {
                    const data = await response.json();
                    currentData.name = data.name || tgUser.first_name;
                    currentData.gender = data.gender || 'Невідомо';
                    currentData.items = data.items || [];
                    currentData.businesses = data.businesses || [];

                    renderUI(data);
                }
            } catch (err) {
                showStatus('❌ Помилка зєднання з сервером', true);
            }
        }

        function renderUI(data) {
            document.getElementById('user-name').innerText = currentData.name;
            document.getElementById('user-level').innerText = data.level || 1;
            document.getElementById('user-balance').innerText = `${(data.balance || 0).toLocaleString()} грн`;
            document.getElementById('user-msgs').innerText = data.msg_count || 0;
            document.getElementById('user-gender').innerText = currentData.gender;

            document.getElementById('edit-name-input').value = currentData.name;
            document.getElementById('edit-gender-select').value = currentData.gender;

            renderList('businesses-container', currentData.businesses, '🏢', 'businesses');
            renderList('inventory-container', currentData.items, '🔹', 'items');
        }

        function renderList(containerId, listData, icon, type) {
            const container = document.getElementById(containerId);
            if (listData.length === 0) {
                container.innerHTML = '<i style="color: var(--hint-color)">Немає...</i>';
                return;
            }

            container.innerHTML = listData.map((item, index) => `
                <div class="list-item">
                    <span>${icon} ${item}</span>
                    <div class="reorder-btns">
                        <button class="btn-mini" onclick="moveItem('${type}', ${index}, -1)">⬆️</button>
                        <button class="btn-mini" onclick="moveItem('${type}', ${index}, 1)">⬇️</button>
                    </div>
                </div>
            `).join('');
        }

        function moveItem(type, index, direction) {
            const list = currentData[type];
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= list.length) return;

            const temp = list[index];
            list[index] = list[newIndex];
            list[newIndex] = temp;

            if (type === 'items') {
                renderList('inventory-container', currentData.items, '🔹', 'items');
                saveOrder(`${API_URL}/api/update_inventory_order`, { items: currentData.items });
            } else if (type === 'businesses') {
                renderList('businesses-container', currentData.businesses, '🏢', 'businesses');
                saveOrder(`${API_URL}/api/update_businesses_order`, { businesses: currentData.businesses });
            }
        }

        async function saveOrder(url, payload) {
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, ...payload })
                });
            } catch (e) {
                console.error("Помилка збереження порядку:", e);
            }
        }

        async function toggleEditMode() {
            const form = document.getElementById('edit-form');
            const btn = document.getElementById('edit-toggle-btn');
            const card = document.querySelector('.profile-card');

            if (!isEditMode) {
                isEditMode = true;
                form.style.display = 'flex';
                card.classList.add('edit-mode');
                btn.innerText = '💾 Зберегти зміни';
            } else {
                const newName = document.getElementById('edit-name-input').value.trim();
                const newGender = document.getElementById('edit-gender-select').value;

                if (newName) currentData.name = newName;
                currentData.gender = newGender;

                btn.disabled = true;
                showStatus('Збереження...');

                try {
                    const res = await fetch(`${API_URL}/api/update_profile`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_id: userId,
                            name: currentData.name,
                            gender: currentData.gender
                        })
                    });

                    if (res.ok) {
                        showStatus('✅ Профіль оновлено!');
                        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    }
                } catch (e) {
                    showStatus('❌ Помилка збереження', true);
                } finally {
                    btn.disabled = false;
                    isEditMode = false;
                    form.style.display = 'none';
                    card.classList.remove('edit-mode');
                    btn.innerText = '⚙️ Редагувати профіль';
                    document.getElementById('user-name').innerText = currentData.name;
                    document.getElementById('user-gender').innerText = currentData.gender;
                }
            }
        }

        function showStatus(msg, isError = false) {
            const el = document.getElementById('status-msg');
            el.innerText = msg;
            el.style.color = isError ? '#ff5252' : '#4caf50';
            setTimeout(() => { el.innerText = ''; }, 3000);
        }

        loadProfile();
    </script>
</body>
</html>
