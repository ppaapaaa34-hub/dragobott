<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drago Profile Mini App</title>
    <!-- Обов'язкове підключення SDK Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1c1c1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #006699;
        }
    </style>
</head>
<body>

    <h2>🐉 Інтерактивний Профіль Drago</h2>
    <p>Натисни кнопку нижче, щоб покращити свій рівень:</p>
    
    <button class="btn" onclick="upgradeLevel()">🚀 Прокачати (1000 монет)</button>

    <script>
        // Ініціалізація Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Розгортаємо веб-додаток

        function upgradeLevel() {
            // Формуємо дані для відправки в бота
            const dataToSend = {
                action: "upgrade_lvl"
            };

            // Надсилаємо дані назад у бот (у handle_web_app_data)
            tg.sendData(JSON.stringify(dataToSend));

            // Закриваємо Mini App
            tg.close();
        }
    </script>
</body>
</html>
